<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="500" fill="#14150f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8b04a"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fb8ff"/></marker>
  </defs>
  <text x="30" y="40" fill="#ebe4cf" font-size="22" font-weight="700">Etapa 1 · quién habla con quién</text>
  <text x="30" y="64" fill="#a39d88" font-size="14">El servidor no simula nada todavía: solo reparte mensajes dentro de cada sala.</text>

  <!-- navegador Lucas -->
  <rect x="30" y="100" width="230" height="150" rx="6" fill="#1f211a" stroke="#4a4c40" stroke-width="2"/>
  <text x="45" y="126" fill="#ebe4cf" font-size="15" font-weight="700">Navegador de Lucas</text>
  <rect x="45" y="140" width="200" height="40" fill="#2a2c24"/><text x="55" y="165" fill="#d8cfae" font-size="13">index.html · el juego</text>
  <rect x="45" y="192" width="200" height="40" fill="#3a2a18"/><text x="55" y="217" fill="#ffcf8a" font-size="13">net.js · tu código</text>
  <line x1="145" y1="180" x2="145" y2="192" stroke="#a39d88" stroke-width="2"/>
  <text x="150" y="190" fill="#a39d88" font-size="10">window.HORDA</text>

  <!-- navegador Amigo -->
  <rect x="30" y="300" width="230" height="150" rx="6" fill="#1f211a" stroke="#4a4c40" stroke-width="2"/>
  <text x="45" y="326" fill="#ebe4cf" font-size="15" font-weight="700">Navegador de Amigo</text>
  <rect x="45" y="340" width="200" height="40" fill="#2a2c24"/><text x="55" y="365" fill="#d8cfae" font-size="13">index.html · el juego</text>
  <rect x="45" y="392" width="200" height="40" fill="#3a2a18"/><text x="55" y="417" fill="#ffcf8a" font-size="13">net.js · tu código</text>
  <line x1="145" y1="380" x2="145" y2="392" stroke="#a39d88" stroke-width="2"/>

  <!-- servidor -->
  <rect x="520" y="100" width="330" height="350" rx="6" fill="#1f211a" stroke="#d4592b" stroke-width="2"/>
  <text x="540" y="128" fill="#ebe4cf" font-size="15" font-weight="700">Servidor · server/index.js</text>
  <text x="540" y="148" fill="#a39d88" font-size="12">Node.js + Express + Socket.IO</text>
  <rect x="540" y="165" width="290" height="130" fill="#2a2c24"/>
  <text x="552" y="187" fill="#ffcf8a" font-size="13" font-weight="700">salas (en memoria)</text>
  <text x="552" y="210" fill="#d8cfae" font-size="12" font-family="Consolas, monospace">"prueba-1" →</text>
  <text x="570" y="230" fill="#d8cfae" font-size="12" font-family="Consolas, monospace">id_lucas → { x, y, z, yaw, … }</text>
  <text x="570" y="250" fill="#d8cfae" font-size="12" font-family="Consolas, monospace">id_amigo → { x, y, z, yaw, … }</text>
  <text x="552" y="276" fill="#d8cfae" font-size="12" font-family="Consolas, monospace">"otra-sala" → …</text>
  <text x="540" y="325" fill="#ebe4cf" font-size="13" font-weight="700">Reglas de la etapa 1</text>
  <text x="540" y="348" fill="#d8cfae" font-size="12">1. Al unirse: responder solo a ese socket.</text>
  <text x="540" y="370" fill="#d8cfae" font-size="12">2. Al recibir estado: reenviarlo a los demás</text>
  <text x="556" y="388" fill="#d8cfae" font-size="12">de la MISMA sala.</text>
  <text x="540" y="410" fill="#d8cfae" font-size="12">3. Al desconectarse: avisar y limpiar.</text>

  <!-- flechas -->
  <path d="M245 205 C 380 190, 420 190, 520 205" fill="none" stroke="#e8b04a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="300" y="182" fill="#e8b04a" font-size="12" font-family="Consolas, monospace">jugador:estado (cada 50 ms)</text>
  <path d="M520 250 C 420 300, 380 360, 245 405" fill="none" stroke="#6fb8ff" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="330" y="330" fill="#6fb8ff" font-size="12" font-family="Consolas, monospace">jugador:estado {id, estado}</text>
  <text x="330" y="346" fill="#a39d88" font-size="11">solo a los otros de "prueba-1"</text>
  <text x="30" y="482" fill="#a39d88" font-size="12">Naranja: lo que manda un cliente. Azul: lo que el servidor reenvía. Amigo también manda su estado y Lucas lo recibe igual.</text>
</svg>
